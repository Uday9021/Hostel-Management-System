apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostel-web
  labels:
    app: hostel-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostel-web
  template:
    metadata:
      labels:
        app: hostel-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: hostel-web
          image: REPLACE_WITH_DOCKERHUB_USERNAME/hostel-cicd:latest
          imagePullPolicy: Always
          env:
            - name: HOSTEL_DATABASE
              value: /data/hostel.db
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: hostel-data
              mountPath: /data
      volumes:
        - name: hostel-data
          persistentVolumeClaim:
            claimName: hostel-web-data
